name: Pipeline CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  job1:    
    name: build_ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4        
        with:
          role-to-assume: arn:aws:iam::767407960332:role/GitHubActionsRepoApp
          aws-region: us-east-2  

      - name: Amazon ECR "Login" Action for GitHub Actions
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Build, Tag and Push  image to Amazon ECR
        run: |
          docker build -t meu-website:v1.0 .
          docker tag meu-website:v1.0 767407960332.dkr.ecr.us-east-2.amazonaws.com/site_prod:v1.0
          docker push 767407960332.dkr.ecr.us-east-2.amazonaws.com/site_prod:v1.0

